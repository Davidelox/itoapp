<!-- Supabase → Authentication → Emails → Templates → «Confirm signup».
     Asunto: Confirma tu email en ito
     Cambia URL_DEL_LOGO por la URL pública de assets/brand/ito-logo-email.png -->
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#FBF7E9;padding:32px 16px;font-family:Helvetica,Arial,sans-serif;color:#2A2627;">
  <tr><td align="center">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:480px;">
      <tr><td align="center" style="padding-bottom:24px;">
        <img src="URL_DEL_LOGO" width="140" height="80" alt="ito" style="display:block;border:0;width:140px;height:80px;">
      </td></tr>
      <tr><td style="background:#FFFFFF;border-radius:16px;padding:32px 24px;">
        <p style="margin:0 0 16px;font-size:16px;line-height:24px;">Tu código para confirmar tu email es:</p>
        <p style="margin:0 0 16px;font-size:32px;line-height:40px;font-weight:bold;letter-spacing:6px;color:#7B2433;text-align:center;">{{ .Token }}</p>
        <p style="margin:0 0 24px;font-size:14px;line-height:21px;color:#625C5A;">Caduca en 1 hora.</p>
        <p style="margin:0 0 24px;font-size:14px;line-height:21px;">También puedes pulsar este enlace: <a href="{{ .ConfirmationURL }}" style="color:#7B2433;font-weight:bold;">Confirmar mi email</a></p>
        <p style="margin:0;font-size:13px;line-height:20px;color:#625C5A;">Si no has creado una cuenta en ito, ignora este correo.</p>
      </td></tr>
    </table>
  </td></tr>
</table>
